name: open-reasoning-engine

services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      model-pull:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/uploads

  qdrant:
    image: qdrant/qdrant:v1.15.4-unprivileged
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  model-pull:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull $${OLLAMA_MODEL:-qwen2.5:7b-instruct}"]
    env_file: .env
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  qdrant-data:
  ollama-data:
  uploads:

